[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-species-response-pilot"
version = "0.1.0"
description = "Auditable design-stage pilots for cross-species perturbation response transfer"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]
